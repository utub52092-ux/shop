<!doctype html>
<html lang="ru" data-t="dark" data-ac="orange">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SaydShop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#15171d;--card:#1e2129;--card2:#262a34;--ink:#f1f2f5;--mut:#9aa0ad;--line:#2f3340;--ok:#3ecf8e}
[data-t=light]{--bg:#f5f3ef;--card:#fff;--card2:#ece9e3;--ink:#1d1f24;--mut:#6b7080;--line:#ddd9d1}
[data-ac=orange]{--ac:#f97316;--on:#1c0f02}
[data-ac=yellow]{--ac:#eab308;--on:#1c1602}
[data-ac=red]{--ac:#ef4444;--on:#fff}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",Roboto,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--ac);color:var(--on);padding:9px 16px;border-radius:10px;font-weight:600}
button.g{background:var(--card2);color:var(--ink)}
button.d{background:#c0392b;color:#fff}
button:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font-size:20px;font-weight:800;letter-spacing:-.5px}.logo span{color:var(--ac)}
.bal{display:flex;align-items:center;gap:10px;font-weight:700}.bal button{padding:6px 12px;font-size:13px}
.wrap{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 60px)}
nav{border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px}
nav a{padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--mut)}
nav a:hover{background:var(--card)}nav a.on{background:var(--card);color:var(--ink);box-shadow:inset 3px 0 var(--ac)}
main{padding:20px;max-width:900px;width:100%}
h2{font-size:24px;letter-spacing:-.5px;margin-bottom:14px}h3{margin:16px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.cat{cursor:pointer;min-height:130px;display:flex;flex-direction:column;justify-content:space-between}
.cat:hover{border-color:var(--ac)}.cat i{font-size:34px;font-style:normal}
.mut{color:var(--mut);font-size:13px}.price{font-weight:800;font-size:18px;color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button{background:var(--card2);color:var(--mut)}.tabs button.on{background:var(--ac);color:var(--on)}
.steps{display:flex;gap:6px;margin:12px 0}.step{flex:1;padding:8px;border-radius:10px;background:var(--card2);color:var(--mut);font-size:12px;text-align:center;border:1px solid transparent}
.step.on{background:var(--ac);color:var(--on);font-weight:700}.step.done{border-color:var(--ac);color:var(--ink)}
.chat{height:320px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:10px;background:var(--card2);border-radius:12px;margin-bottom:8px}
.pi{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;margin-bottom:10px;display:block;background:var(--card2)}.ph{display:flex;align-items:center;justify-content:center;font-size:40px}
.th{width:48px;height:48px;object-fit:cover;border-radius:8px}.back{color:var(--mut);cursor:pointer;display:inline-block;margin-bottom:8px}.back:hover{color:var(--ink)}
.lvl{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:12px;padding:12px 14px;margin:12px 0;display:flex;flex-direction:column;gap:4px}
.lvl span{color:var(--mut);font-size:13px}.lvl.ok{border-left-color:var(--ok)}
.bar{display:flex;gap:4px;margin-top:6px}.bar i{flex:1;height:4px;border-radius:2px;background:var(--card2)}.bar i.on{background:var(--ac)}
.cm{align-self:center;text-align:center;border:1px solid var(--ac);max-width:90%}.cm button{display:block;width:100%;margin-top:10px}
.m{max-width:80%;padding:8px 12px;border-radius:12px;background:var(--card);word-break:break-word}
.m.me{align-self:flex-end;background:var(--ac);color:var(--on)}.m small{display:block;opacity:.65;font-size:11px}
.send{display:flex;gap:8px}.send input{margin:0}
.auth{max-width:380px;margin:8vh auto;padding:0 16px}.auth h1{font-size:34px;letter-spacing:-1px;margin-bottom:4px}
#modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#modal .card{max-width:400px;width:100%}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:30;display:none}
.sw{display:flex;gap:10px}.sw b{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw b.on{border-color:var(--ink)}
#st{position:fixed;right:10px;bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;z-index:6;max-width:260px;cursor:pointer}
#st .lg{display:none;margin-top:6px;max-height:140px;overflow:auto;color:var(--mut)}#st.open .lg{display:block}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--card2);color:var(--mut)}.tag.b{background:#c0392b;color:#fff}
@media(max-width:700px){.wrap{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}nav a{white-space:nowrap}main{padding:14px}}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const ADMIN_CODE='ADMIN228008228008',TG_USER='Sayd1n169';
const CATS={games:['Игровые товары','🎮'],web:['Сайты и дизайны','🎨'],social:['Соцсети','📣']};
const ST=['Ожидается выполнение заказа','Выполнение заказа','Подтверждение заказа'];
const DESC=['Вы ждёте. Продавец скоро возьмёт заказ в работу.','Продавец выполняет ваш заказ. Мы сообщим, когда он будет готов.','Заказ выполнен. Проверьте, что всё пришло, и подтвердите это кнопкой в чате.'];
const stt=o=>o.done?'Заказ завершён':ST[o.st];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number(n).toLocaleString('ru-RU')+' ₽';
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let db=ld('sm_db',{users:{},products:[],orders:[],topups:[],log:[],presence:{},seq:1});
let set=ld('sm_set',{t:'dark',ac:'orange'}),sess=ld('sm_sess',null),view='home',amode='in',atab='orders',modal='',sig='';
if(!db.products.length){db.products=[
 {id:1,cat:'games',name:'Пример: игровая валюта',desc:'Замените в админ-панели',price:300},
 {id:2,cat:'web',name:'Пример: лендинг под ключ',desc:'Замените в админ-панели',price:1500},
 {id:3,cat:'social',name:'Пример: оформление канала',desc:'Замените в админ-панели',price:500}];db.seq=10;localStorage.setItem('sm_db',JSON.stringify(db))}
// Любое изменение: перечитать, изменить, сохранить
function tx(fn){db=ld('sm_db',db);fn();try{localStorage.setItem('sm_db',JSON.stringify(db))}catch(e){toast('Память браузера заполнена: уменьшите фото')}}
const img=f=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,640/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.75))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)});
const log=x=>{db.log.unshift({t:Date.now(),x});db.log=db.log.slice(0,40)};
const U=()=>sess&&db.users[sess.nick];
const hash=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sm:'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function openTG(text){const u='https://t.me/'+TG_USER+'?text='+encodeURIComponent(text);const w=window.Telegram&&Telegram.WebApp;w&&w.openTelegramLink?w.openTelegramLink(u):window.open(u,'_blank')}
const online=()=>Object.values(db.presence).filter(t=>Date.now()-t<25000).length;

/* ---------- ЭКРАНЫ ---------- */
function authV(){const up=amode=='up';return `<div class="auth"><h1>Sayd<span style="color:var(--ac)">Shop</span></h1><p class="mut" style="margin-bottom:18px">Игровые товары, сайты, дизайны и соцсети</p>
<div class="tabs"><button data-a="amode" data-v="in" class="${up?'':'on'}">Вход</button><button data-a="amode" data-v="up" class="${up?'on':''}">Регистрация</button></div>
<label>Никнейм</label><input id="nick" autocomplete="username" maxlength="20">
<label>Пароль</label><input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}">
${up?'<label>Повторите пароль</label><input id="pw2" type="password" autocomplete="new-password">':''}
<button style="width:100%" data-a="${up?'reg':'login'}">${up?'Зарегистрироваться':'Войти'}</button></div>`}

function shell(){const u=U(),adm=sess.admin;
const nav=[['home','Главная'],['catalog','Каталог'],['orders','Мои заказы'],['settings','Настройки']];if(adm)nav.push(['admin','Админ-панель']);
return `<header><b class="logo">Sayd<span>Shop</span></b><div class="bal"><span>${money(u.bal)}</span><button data-a="topup">Пополнить</button></div></header>
<div class="wrap"><nav>${nav.map(([k,v])=>`<a data-a="go" data-v="${k}" class="${view==k||(view.startsWith('order:')&&k=='orders')||(view.startsWith('cat:')&&k=='catalog')?'on':''}">${esc(v)}</a>`).join('')}</nav><main>${page()}</main></div>${stat()}`}

function page(){const u=U();
if(view=='home')return `<h2>Что вам нужно?</h2><p class="mut" style="max-width:460px;margin-bottom:16px">Пополните баланс, выберите товар в каталоге и нажмите «Купить». Дальше общение с продавцом идёт в чате заказа.</p><button data-a="go" data-v="catalog">Открыть каталог</button>`;
if(view=='catalog')return `<h2>Каталог</h2><div class="grid">${Object.entries(CATS).map(([k,v])=>`<div class="card cat" data-a="go" data-v="cat:${k}"><i>${v[1]}</i><div><b>${v[0]}</b><div class="mut">Товаров: ${db.products.filter(p=>p.cat==k).length}</div></div></div>`).join('')}</div>`;
if(view.startsWith('cat:')){const k=view.slice(4),ps=db.products.filter(p=>p.cat==k);
return `<a class="back" data-a="go" data-v="catalog">← Каталог</a><h2>${CATS[k][0]}</h2>${ps.length?`<div class="grid">${ps.map(p=>`<div class="card">${p.img?`<img class="pi" src="${p.img}" alt="">`:`<div class="pi ph">${CATS[k][1]}</div>`}<b>${esc(p.name)}</b><p class="mut" style="margin:6px 0 12px">${esc(p.desc)}</p><div class="row"><span class="price">${money(p.price)}</span><button data-a="buy" data-id="${p.id}">Купить</button></div></div>`).join('')}</div>`:'<p class="mut">В этом каталоге пока пусто.</p>'}`}
if(view=='orders'){const os=db.orders.filter(o=>o.nick==u.nick).reverse(),ts=db.topups.filter(t=>t.nick==u.nick).reverse();
return `<h2>Мои заказы</h2>${os.length?os.map(o=>`<div class="card" style="margin-bottom:10px;cursor:pointer" data-a="open" data-id="${o.id}"><div class="row"><b>${esc(o.name)}</b><span class="price">${money(o.price)}</span></div><span class="tag">${stt(o)}</span></div>`).join(''):'<p class="mut">Заказов пока нет.</p>'}
<h3>Заявки на пополнение</h3>${ts.length?ts.map(t=>`<div class="row mut" style="padding:4px 0"><span>${money(t.amt)}</span><span class="tag">${t.done?'Зачислено':'Ожидает'}</span></div>`).join(''):'<p class="mut">Нет заявок.</p>'}`}
if(view.startsWith('order:'))return orderV(+view.slice(6));
if(view=='settings')return `<h2>Настройки</h2><div class="card"><b>Стиль</b><div class="tabs" style="margin-top:8px"><button data-a="theme" data-v="dark" class="${set.t=='dark'?'on':''}">Тёмный</button><button data-a="theme" data-v="light" class="${set.t=='light'?'on':''}">Светлый</button></div>
<b>Акцентный цвет</b><div class="sw" style="margin-top:8px">${[['orange','#f97316'],['yellow','#eab308'],['red','#ef4444']].map(([k,c])=>`<b data-a="ac" data-v="${k}" style="background:${c}" class="${set.ac==k?'on':''}" title="${k}"></b>`).join('')}</div></div>
<div class="card" style="margin-top:12px"><b>Ваш ID</b><p class="mut">${u.id} (нужен для пополнения)</p></div>
<div class="card" style="margin-top:12px"><b>Секретный код</b><input id="code" type="password" placeholder="Код доступа" autocomplete="off">${sess.admin?'<button class="g" data-a="adminout">Выйти из админки</button>':'<button data-a="adminin">Войти</button>'}</div>
<button class="g" style="margin-top:12px" data-a="logout">Выйти из аккаунта</button>`;
if(view=='admin'&&sess.admin)return adminV();
return ''}

function cmsg(o,m,last){const can=last&&o.st==2&&!o.done&&o.nick.toLowerCase()==sess.nick;
return `<div class="m cm"><small>Продавец</small>${esc(m.x)}${can?`<button data-a="confirm" data-id="${o.id}">Подтвердить заказ</button>`:o.done?'<span class="mut" style="display:block;margin-top:8px">✅ Заказ подтверждён</span>':last&&o.st==2?'<span class="mut" style="display:block;margin-top:8px">Ждём подтверждения покупателя</span>':''}</div>`}
function orderV(id){const o=db.orders.find(x=>x.id==id);if(!o||(!sess.admin&&o.nick!=sess.nick))return '<p class="mut">Заказ не найден.</p>';
const role=sess.admin?'a':'u';
const own=o.nick.toLowerCase()==sess.nick,lc=o.msgs.map(m=>m.k).lastIndexOf('confirm');
return `<h2>${esc(o.name)}</h2><div class="mut">Заказ №${o.id} · ${esc(o.nick)} · ${money(o.price)}</div>
${o.done?`<div class="lvl ok"><b>Заказ завершён</b><span>Вы подтвердили получение. Спасибо за покупку!</span></div>`:`<div class="lvl"><b>${ST[o.st]}</b><span>${DESC[o.st]}</span><div class="bar">${[0,1,2].map(i=>`<i class="${i<=o.st?'on':''}"></i>`).join('')}</div></div>`}
${sess.admin&&!o.done?`<div class="tabs">${ST.map((x,i)=>`<button class="${i==o.st?'on':''}" data-a="setst" data-id="${o.id}" data-s="${i}">${x}</button>`).join('')}</div>`:''}
<div class="chat" id="chat">${o.msgs.map((m,j)=>m.k=='confirm'?cmsg(o,m,j===lc):`<div class="m ${m.f==role?'me':''}"><small>${m.f=='a'?'Продавец':esc(o.nick)}</small>${esc(m.x)}</div>`).join('')||'<span class="mut">Напишите сообщение продавцу.</span>'}${own&&o.st==2&&!o.done&&lc<0?cmsg(o,{x:'Заказ выполнен. Проверьте, что всё пришло.'},true):''}</div>
<div class="send"><input id="msg" placeholder="Сообщение…" maxlength="500"><button data-a="send" data-id="${o.id}">Отправить</button></div>`}

function adminV(){
const tabs=[['orders','Заказы'],['topups','Заявки'],['products','Товары'],['users','Игроки']];
let b='';
if(atab=='orders')b=db.orders.slice().reverse().map(o=>`<div class="card" style="margin-bottom:8px"><div class="row"><b>#${o.id} ${esc(o.name)}</b><span class="mut">${esc(o.nick)} · ${money(o.price)}</span></div><div class="tabs" style="margin:10px 0 8px">${o.done?'<span class="tag">Заказ завершён покупателем</span>':ST.map((x,i)=>`<button class="${i==o.st?'on':''}" data-a="setst" data-id="${o.id}" data-s="${i}">${x}</button>`).join('')}</div><button class="g" data-a="open" data-id="${o.id}">Открыть чат</button></div>`).join('')||'<p class="mut">Заказов нет.</p>';
if(atab=='topups')b=db.topups.slice().reverse().map(t=>`<div class="card" style="margin-bottom:8px"><div class="row"><span><b>${money(t.amt)}</b> · ${esc(t.nick)} · ID ${t.uid}</span>${t.done?'<span class="tag">Зачислено</span>':`<button data-a="approve" data-id="${t.id}">Зачислить</button>`}</div></div>`).join('')||'<p class="mut">Заявок нет.</p>';
if(atab=='products')b=`<div class="card"><label>Каталог</label><select id="pc">${Object.entries(CATS).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><label>Название</label><input id="pn"><label>Описание</label><input id="pd"><label>Цена, ₽</label><input id="pp" type="number" min="1"><label>Фото (необязательно)</label><input id="pf" type="file" accept="image/*"><button data-a="addp">Добавить товар</button></div><h3>Все товары</h3>${db.products.map(p=>`<div class="card row" style="margin-bottom:8px"><span style="display:flex;gap:10px;align-items:center">${p.img?`<img class="th" src="${p.img}" alt="">`:''}<span><b>${esc(p.name)}</b><br><span class="mut">${CATS[p.cat][0]} · ${money(p.price)}</span></span></span><span><button class="g" data-a="photo" data-id="${p.id}">Сменить фото</button> <button class="d" data-a="delp" data-id="${p.id}">Удалить</button></span></div>`).join('')}`;
if(atab=='users')b=Object.values(db.users).map(u=>`<div class="card" style="margin-bottom:8px"><div class="row"><span><b>${esc(u.nick)}</b> ${u.blocked?'<span class="tag b">Заблокирован</span>':''}<br><span class="mut">ID ${u.id} · ${money(u.bal)}</span></span><button class="${u.blocked?'':'d'}" data-a="block" data-n="${esc(u.nick)}">${u.blocked?'Разблокировать':'Заблокировать'}</button></div>
<div class="send" style="margin-top:8px"><input type="number" placeholder="Сумма (можно минус)" id="cr-${esc(u.nick)}"><button class="g" data-a="credit" data-n="${esc(u.nick)}">Выдать на баланс</button></div></div>`).join('')||'<p class="mut">Игроков нет.</p>';
return `<h2>Админ-панель</h2><div class="tabs">${tabs.map(([k,v])=>`<button class="${atab==k?'on':''}" data-a="atab" data-v="${k}">${v}</button>`).join('')}</div>${b}`}

function stat(){const h=Date.now()-6e5,act=db.log.filter(l=>l.t>h).length;
return `<div id="st" ${sess.admin?'data-a="stopen"':''}><span class="dot"></span>онлайн ${online()} · заказов ${db.orders.length} · активность ${act}${sess.admin?`<div class="lg">${db.log.slice(0,15).map(l=>new Date(l.t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+' '+esc(l.x)).join('<br>')||'Пока тихо'}</div>`:''}</div>`}

/* ---------- РЕНДЕР ---------- */
function render(){const y=scrollY,open=$('#st')&&$('#st').classList.contains('open');
document.documentElement.dataset.t=set.t;document.documentElement.dataset.ac=set.ac;
const u=U();
if(sess&&u&&u.blocked)$('#app').innerHTML=`<div class="auth"><h1>Доступ закрыт</h1><p class="mut" style="margin:10px 0 16px">Ваш аккаунт заблокирован за нарушение правил. Если это ошибка, напишите продавцу.</p><button data-a="logout">Выйти</button></div>`;
else $('#app').innerHTML=(sess&&u?shell():authV())+(modal?`<div id="modal"><div class="card">${modal}</div></div>`:'');
const c=$('#chat');if(c)c.scrollTop=c.scrollHeight;if(open&&$('#st'))$('#st').classList.add('open');scrollTo(0,y);
sig=sigNow()}
const sigNow=()=>JSON.stringify([db.users,db.products,db.orders,db.topups,online(),db.log.length]);

/* ---------- ДЕЙСТВИЯ ---------- */
const val=id=>($('#'+id)||{}).value||'';
const A={
amode(d){amode=d.v;render()},
async reg(){const n=val('nick').trim(),p=val('pw'),p2=val('pw2'),k=n.toLowerCase();
 if(n.length<3)return toast('Никнейм: минимум 3 символа');if(p.length<6)return toast('Пароль: минимум 6 символов');if(p!=p2)return toast('Пароли не совпадают');
 const ph=await hash(p);let ok=true;
 tx(()=>{if(db.users[k]){ok=false;return}db.users[k]={nick:n,id:String(100000+Math.floor(Math.random()*899999)),pass:ph,bal:0,blocked:false};log('регистрация: '+n)});
 if(!ok)return toast('Такой никнейм уже занят');sess={nick:k,admin:false};localStorage.setItem('sm_sess',JSON.stringify(sess));view='home';render()},
async login(){const k=val('nick').trim().toLowerCase();db=ld('sm_db',db);const u=db.users[k];
 if(!u||u.pass!=await hash(val('pw')))return toast('Неверный никнейм или пароль');
 sess={nick:k,admin:false};localStorage.setItem('sm_sess',JSON.stringify(sess));tx(()=>log('вход: '+u.nick));view='home';render()},
logout(){sess=null;localStorage.removeItem('sm_sess');view='home';render()},
go(d){view=d.v;render()},
topup(){const u=U();modal=`<h3 style="margin-top:0">Пополнение баланса</h3><p class="mut" style="margin-bottom:10px">Укажите сумму и нажмите «Подать заявку». Когда заявка создастся, вы получите реквизиты в Телеграме. Отправьте на них указанную сумму, и деньги придут на ваш баланс.</p><label>Сумма, ₽</label><input id="ta" type="number" min="1"><label>Никнейм</label><input value="${esc(u.nick)}" readonly><label>Ваш ID</label><input value="${u.id}" readonly><button data-a="sendtop">Подать заявку</button> <button class="g" data-a="close">Отмена</button>`;render()},
sendtop(){const u=U(),a=Math.floor(+val('ta'));if(!(a>0))return toast('Введите сумму');
 tx(()=>{db.topups.push({id:db.seq++,nick:u.nick,uid:u.id,amt:a,done:false});log(u.nick+': заявка на '+a+' ₽')});modal='';render();
 openTG(`Заявка на пополнение\nСумма: ${a} ₽\nНикнейм: ${u.nick}\nID: ${u.id}`)},
close(){modal='';render()},
buy(d){const p=db.products.find(x=>x.id==d.id);if(!p)return;modal=`<h3 style="margin-top:0">Подтверждение покупки</h3><p>Вы точно хотите купить этот товар?</p><p style="margin:8px 0 14px"><b>${esc(p.name)}</b><br><span class="price">${money(p.price)}</span></p><button data-a="buyyes" data-id="${p.id}">Да</button> <button class="g" data-a="close">Нет</button>`;render()},
buyyes(d){const u=U(),p=db.products.find(x=>x.id==d.id);if(!p)return;
 if(u.bal<p.price){toast('Недостаточно средств. Пополните баланс');return A.topup()}
 let id;tx(()=>{db.users[u.nick.toLowerCase()].bal-=p.price;id=db.seq++;db.orders.push({id,nick:u.nick,name:p.name,price:p.price,st:0,msgs:[]});log(u.nick+' купил «'+p.name+'»')});
 view='order:'+id;modal=`<h3 style="margin-top:0">Заказ оформлен</h3><p>Товар или услуга выполняется, подождите немного. Вас осведомят, когда товар будет готов.</p><button data-a="close" style="margin-top:12px">Понятно</button>`;render()},
confirm(d){modal=`<h3 style="margin-top:0">Подтверждение заказа</h3><p>Вы точно хотите подтвердить заказ? Убедитесь, что товар или услуга получены.</p><div style="margin-top:14px"><button data-a="confirmyes" data-id="${d.id}">Да</button> <button class="g" data-a="close">Нет</button></div>`;render()},
confirmyes(d){tx(()=>{const o=db.orders.find(o=>o.id==d.id);if(o&&o.nick.toLowerCase()==sess.nick&&o.st==2&&!o.done){o.done=true;o.msgs.push({f:'u',x:'✅ Заказ подтверждён: всё получено.'});log('заказ #'+o.id+' подтверждён')}});modal='';render();toast('Заказ подтверждён')},
open(d){view='order:'+d.id;render()},
send(d){const x=val('msg').trim();if(!x)return;tx(()=>{const o=db.orders.find(o=>o.id==d.id);o.msgs.push({f:sess.admin?'a':'u',x});log('сообщение в заказе #'+o.id)});render();$('#msg').focus()},
setst(d){tx(()=>{const o=db.orders.find(o=>o.id==d.id),n=+d.s;if(o.st==n)return;o.st=n;if(n==2)o.msgs.push({f:'a',k:'confirm',x:'Подтвердите заказ'});log('заказ #'+d.id+': '+ST[n])});render();toast('Этап обновлён')},
theme(d){set.t=d.v;localStorage.setItem('sm_set',JSON.stringify(set));render()},
ac(d){set.ac=d.v;localStorage.setItem('sm_set',JSON.stringify(set));render()},
adminin(){if(val('code')!==ADMIN_CODE)return toast('Неверный код');sess.admin=true;localStorage.setItem('sm_sess',JSON.stringify(sess));view='admin';render()},
adminout(){sess.admin=false;localStorage.setItem('sm_sess',JSON.stringify(sess));view='settings';render()},
stopen(){$('#st').classList.toggle('open')},
atab(d){atab=d.v;render()},
async addp(){const n=val('pn').trim(),p=+val('pp'),c=val('pc'),d=val('pd').trim(),f=$('#pf')&&$('#pf').files[0];if(!n||!(p>0))return toast('Укажите название и цену');let im='';if(f){try{im=await img(f)}catch(e){return toast('Не удалось загрузить фото')}}tx(()=>db.products.push({id:db.seq++,cat:c,name:n,desc:d,price:Math.floor(p),img:im}));render();toast('Товар добавлен')},
photo(d){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;try{const im=await img(i.files[0]);tx(()=>{db.products.find(p=>p.id==d.id).img=im});render();toast('Фото обновлено')}catch(e){toast('Не удалось загрузить фото')}};i.click()},
delp(d){tx(()=>db.products=db.products.filter(p=>p.id!=d.id));render()},
approve(d){tx(()=>{const t=db.topups.find(t=>t.id==d.id),u=db.users[t.nick.toLowerCase()];if(u&&!t.done){u.bal+=t.amt;t.done=true;log('зачислено '+t.amt+' ₽ → '+u.nick)}});render()},
credit(d){const a=Math.floor(+val('cr-'+d.n));if(!a)return toast('Введите сумму');tx(()=>{db.users[d.n.toLowerCase()].bal+=a;log('баланс '+d.n+': '+(a>0?'+':'')+a+' ₽')});render();toast('Готово')},
block(d){tx(()=>{const u=db.users[d.n.toLowerCase()];u.blocked=!u.blocked;log((u.blocked?'блок: ':'разблок: ')+u.nick)});render()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&A[el.dataset.a]){if(el.dataset.a=='stopen'&&e.target.closest('.lg'))return;A[el.dataset.a](el.dataset)}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'){const t=e.target;if(t.id=='msg')A.send({id:+view.slice(6)});else if(t.id=='pw'||t.id=='pw2')A[amode=='up'?'reg':'login']()}});

/* ---------- ПУЛЬС: онлайн + синхронизация вкладок ---------- */
setInterval(()=>{if(sess&&U()){tx(()=>db.presence[sess.nick]=Date.now())}
 else db=ld('sm_db',db);
 const f=document.activeElement;if(!modal&&!(f&&/INPUT|TEXTAREA|SELECT/.test(f.tagName))&&sigNow()!=sig)render()},4000);
window.Telegram&&Telegram.WebApp&&(Telegram.WebApp.ready(),Telegram.WebApp.expand());
render();
</script>
</body>
</html>
